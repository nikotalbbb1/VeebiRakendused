<!DOCTYPE html>
<html lang="et">

<head>
  <link rel="stylesheet" href="tabelstyle.css">
    <meta charset="UTF-8">
    <title>Tabeli loomine töö</title>
</head>
<body>
<table id="tabelis">
  <tr>
    <td rowspan="4">A</td>
    <td colspan="5">B</td>
  </tr>
  <tr>
<td>D</td>
    <td>F</td>
    <td rowspan="1">E</td>
    <td>G</td>
  </tr>
  <tr>
<td colspan="2">H</td>
    <td>J</td>
    <td>K</td>
  </tr>
  <tr>
    <td>L</td>
    <td colspan="2">M</td>
    <td>N</td>
  </tr>
  <td colspan="5">C</td>
  </tr>
</table>
</body>
</html>

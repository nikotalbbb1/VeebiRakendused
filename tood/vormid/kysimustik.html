<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>Muusika küsimustik</h1>
<link rel="stylesheet" href="vormstyle.css">
<script src="../Js/kysimustikscript.js"></script>
<div>HTML vormid ja nupud</div>
<form action="#">
    <table border="1">
        <tr>
            <td>
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Nikita" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali...</option>
                    <option value="hiphop">HipHop</option>
                    <option value="kantri">Kantri</option>
                    <option value="rock">Rock</option>
                    <option value="metal">Metal</option>
                    <option value="jazz">Jazz</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <!-- radio nupud -üks valik mitmest -->
            <td>
                <strong>Kuidas sa muusikat peamiselt kuulad?</strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">Raadio</label>
                <input type="radio" name="platvorm" id="vinüüplaat" value="vinüüplaat" onclick="radioValik()" >
                <label for="vinüüplaat">Vinüüplaat</label>

            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <!-- checkbox -->
            <td colspan="2">
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input  type="checkbox" name="lemmikud" id="rollingstones" value="rollingstones" onchange="checkboxValik()">
                    <label for="rollingstones">Rolling stones</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="systemofdown" value="systemofdown" onchange="checkboxValik()">
                    <label for="systemofdown">System of down</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica" value="metallica" onchange="checkboxValik()">
                    <label for="metallica">Metallica</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="värv">Millise värviga seostub sinu jaoks muusika?</label>
            </td>
            <td>
                <input type="color" id="värv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="file">Palun lisa fail oma lemmik laul</label>
            </td>
            <td>
                <input type="file" id="file">
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Sisesta oma email</label>
            </td>
            <td>
                <input type="email" id="email" placeholder="näidis@gmail.com">
            </td>
        </tr>
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <textarea name="arvamus" id="arvamus" cols="30" rows="10"></textarea>
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="date">Vormi täitmise kuupäev: </label>
            </td>
            <td>
                <input type="date" id="date" value="2026-09-21">
            </td>
        </tr>
        <tr>
            <td>
                <label for="radiojaam">Radiojaam</label>
            </td>
            <td>
                <input type="text" id="radiojaam" oninput="radioValik()">
            </td>
            <td>
                <div id="vastus8"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="submit">Esita</label>
            </td>
            <td>
                <input type="submit" id="submit">
            </td>
        </tr>
        <tr>
            <td>
                <strong>Kas sa kuulad raadio?</strong>
            </td>
            <td>
                <input type="radio" name="radioValik" id="jah">
                <label for="jah">Jah</label>
                <input type="radio" name="radioValik" id="ei">
                <label for="ei">Ei</label>
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita" onclick="naitaKoike()">
            </td>
            <td>
                <div id="vastusKoik"></div>
            </td>
        </tr>


    </table>

</form>
</body>
</html>
